    <script>
      // applies a saved palette before the first paint; the switcher calls the same function
      window.applyPalette = function (choice) {
        var root = document.documentElement, roles = ["--p-bg", "--p-rule", "--p-accent", "--p-text", "--p-glow"];
        var custom = choice.id === "custom";
        if (custom && !(Array.isArray(choice.colors) && choice.colors.length === 4 && choice.colors.every(function (c) { return /^#[0-9a-f]{6}$/i.test(c); }))) return;
        root.dataset.palette = choice.id;
        roles.forEach(function (k, i) { custom ? root.style.setProperty(k, choice.colors[Math.min(i, 3)]) : root.style.removeProperty(k); });
      };
      try { var saved = JSON.parse(localStorage.getItem("palette")); if (saved && saved.id) applyPalette(saved); } catch (e) {}
    </script>
    <meta name="description" content="Shreyas Namdeo. AI/ML engineer from India. Vision models, AI agents, multi-agent systems." />
